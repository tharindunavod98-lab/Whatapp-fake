<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vokidoki - 3D Synthetic Wave Chat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body, html {
            height: 100%;
            background-color: #05050a;
            color: #fff;
            overflow: hidden;
        }
        /* 3D Synthetic Wave Canvas Background */
        #waveCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.6;
        }
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 600px;
            margin: 0 auto;
            background: rgba(10, 10, 20, 0.75);
            backdrop-filter: blur(12px);
            border-left: 1px solid rgba(0, 255, 200, 0.1);
            border-right: 1px solid rgba(0, 255, 200, 0.1);
        }
        /* Header */
        .app-header {
            padding: 15px 20px;
            background: rgba(15, 15, 30, 0.9);
            border-bottom: 1px solid rgba(0, 255, 200, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .app-title {
            font-size: 1.2rem;
            color: #00ffc8;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 255, 200, 0.5);
        }
        .room-badge {
            font-size: 0.8rem;
            background: rgba(0, 255, 200, 0.1);
            color: #00ffc8;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 200, 0.3);
        }
        /* Login / Setup Screen */
        #login-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex: 1;
            padding: 20px;
            text-align: center;
        }
        .login-card {
            background: rgba(20, 20, 40, 0.8);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid rgba(0, 255, 200, 0.3);
            width: 100%;
            max-width: 380px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
        }
        .login-card h2 {
            margin-bottom: 20px;
            color: #00ffc8;
        }
        .input-field {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            background: rgba(5, 5, 15, 0.9);
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }
        .input-field:focus {
            border-color: #00ffc8;
            box-shadow: 0 0 8px rgba(0, 255, 200, 0.4);
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00ffc8, #0088ff);
            border: none;
            border-radius: 8px;
            color: #05050a;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover {
            opacity: 0.9;
            box-shadow: 0 0 15px rgba(0, 255, 200, 0.6);
        }
        /* Chat Area */
        #chat-screen {
            display: none;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.incoming {
            background: rgba(30, 30, 50, 0.8);
            align-self: flex-start;
            border-left: 3px solid #0088ff;
        }
        .message.outgoing {
            background: rgba(0, 100, 100, 0.5);
            align-self: flex-end;
            border-right: 3px solid #00ffc8;
        }
        .msg-user {
            font-size: 0.75rem;
            color: #00ffc8;
            margin-bottom: 3px;
            font-weight: bold;
        }
        /* Chat Input Box */
        .chat-input-area {
            padding: 15px;
            background: rgba(15, 15, 30, 0.9);
            border-top: 1px solid rgba(0, 255, 200, 0.2);
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px 15px;
            background: rgba(5, 5, 15, 0.9);
            border: 1px solid #333;
            border-radius: 25px;
            color: #fff;
            outline: none;
        }
        .chat-input-area input:focus {
            border-color: #00ffc8;
        }
        .send-btn, .mic-btn {
            background: #00ffc8;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            color: #05050a;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }
        .mic-btn {
            background: #ff3366;
            color: #fff;
        }
        .send-btn:hover, .mic-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 10px rgba(0,255,200,0.5);
        }
    </style>
</head>
<body>

    <!-- 3D Synthetic Wave Animation Background -->
    <canvas id="waveCanvas"></canvas>

    <div class="app-container">
        <!-- Header -->
        <div class="app-header">
            <div class="app-title">⚡ VOKIDOKI 3D</div>
            <div id="roomBadgeDisplay" class="room-badge" style="display: none;">Room: <span id="currentRoomName">General</span></div>
        </div>

        <!-- Login Screen -->
        <div id="login-screen">
            <div class="login-card">
                <h2>Welcome to Vokidoki</h2>
                <input type="text" id="usernameInput" class="input-field" placeholder="ඔබේ නම ඇතුළත් කරන්න...">
                <input type="text" id="roomnameInput" class="input-field" placeholder="කාමරයේ නම (Room Name)...">
                <button class="btn" onclick="joinApp()">ඇප් එකට ඇතුළු වන්න</button>
            </div>
        </div>

        <!-- Chat / Walkie-Talkie Screen -->
        <div id="chat-screen">
            <div class="chat-messages" id="chatMessages">
                <div class="message incoming">
                    <div class="msg-user">System</div>
                    කාමරයට සාදරයෙන් පිළිගනිමු! මෙහි පණිවිඩ යැවිය හැක.
                </div>
            </div>
            <div class="chat-input-area">
                <button class="mic-btn" title="Walkie-Talkie Voice">🎙️</button>
                <input type="text" id="messageInput" placeholder="පණිවිඩයක් ලියන්න..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <script>
        // 3D Synthetic Wave Animation Logic
        const canvas = document.getElementById('waveCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let waves = [
            { y: canvas.height / 2, length: 0.01, amplitude: 50, frequency: 0.02, color: 'rgba(0, 255, 200, 0.4)' },
            { y: canvas.height / 2, length: 0.015, amplitude: 35, frequency: 0.03, color: 'rgba(0, 136, 255, 0.3)' },
            { y: canvas.height / 2, length: 0.008, amplitude: 70, frequency: 0.015, color: 'rgba(255, 51, 102, 0.2)' }
        ];

        let increment = 0;

        function animateWaves() {
            ctx.fillStyle = 'rgba(5, 5, 10, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            waves.forEach(wave => {
                ctx.beginPath();
                ctx.moveTo(0, canvas.height / 2);
                for (let i = 0; i < canvas.width; i++) {
                    ctx.lineTo(i, wave.y + Math.sin(i * wave.length + increment * wave.frequency) * wave.amplitude * Math.sin(increment));
                }
                ctx.strokeStyle = wave.color;
                ctx.lineWidth = 2;
                ctx.stroke();
            });

            increment += 0.05;
            requestAnimationFrame(animateWaves);
        }
        animateWaves();

        // App Navigation & Chat Logic
        let currentUser = "";
        let currentRoom = "";

        function joinApp() {
            const user = document.getElementById('usernameInput').value.trim();
            const room = document.getElementById('roomnameInput').value.trim();

            if (!user || !room) {
                alert("කරුණාකර නම සහ කාමරයේ නම ඇතුළත් කරන්න!");
                return;
            }

            currentUser = user;
            currentRoom = room;

            document.getElementById('currentRoomName').innerText = room;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';
            document.getElementById('roomBadgeDisplay').style.display = 'block';
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            const chatMessages = document.getElementById('chatMessages');
            
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', 'outgoing');
            msgDiv.innerHTML = `<div class="msg-user">${currentUser} (You)</div>${text}`;
            
            chatMessages.appendChild(msgDiv);
            input.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
